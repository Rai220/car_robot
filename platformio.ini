; PlatformIO project for the Keyestudio KS5017 ESP32-CAM video car.
; espressif32 6.x pulls arduino-esp32 2.0.x — the series this firmware was written for
; (old esp_camera API + bundled dl_lib headers). Do not bump to 7.x (arduino-esp32 3.x).
;
; Build a specific sketch by overriding the source dir, e.g.:
;   PLATFORMIO_SRC_DIR=firmware/examples/Blink .venv/bin/pio run
; The tools/*.sh wrappers do this for you.

[platformio]
src_dir = firmware/VideoCar
default_envs = esp32cam

[env:esp32cam]
platform = espressif32@^6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -DBOARD_HAS_PSRAM
